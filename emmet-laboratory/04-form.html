<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!--<input type="text" name="" id="">
    <input type="email" name="" id="">
    <input type="password" name="" id="">
    <input type="checkbox" name="" id="">
    <input type="radio" name="" id="">
    <input type="submit" value="">*/-->
<form action="/submit" method="post">
    
        <label for="StudentID">Student ID</label>
        <input type="text" name="" id="StudentID" placeholder="25-xxxx-xxx"> <br><br>

       
        <label for="FullName">Name</label>
        <input type="text" name="" id="FullName" placeholder="Enter full name"> <br><br>
       
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="prefer_not_to_say" name="gender" value="prefer_not_to_say">
        <label for="prefer_not_to_say">Prefer not to say</label><br><br>

        <label for="program">Program:</label>
        <select id="program" name="program" required>
        <option value="" disabled selected>Select your program</option>
        <option value="bsit">BS Information Technology</option>
        <option value="bscs">BS Computer Science</option>
        <option value="bsis">B Multimedia Arts</option>
        </select> <br><br>

        <label for="hobbies_custom">Hobbies:</label>
        <input type="text" id="hobbies_custom" name="hobbies_custom" placeholder="Hobbies (e.g. Photography, Cooking)"> <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="3" cols="30" placeholder="123 Street Name, City"></textarea> <br><br>
        
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

</form>

</body>
</html>
