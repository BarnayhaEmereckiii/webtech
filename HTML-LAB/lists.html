<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing</title>
</head>
<body>
    <h1>A. Unordered List</h1>

        <ul>
            <li>Fried Chicken</li>
            <li>Chicken Alfredo</li>
            <li>Shrimp Alfredo</li>
            <li>Carbonara</li>
            <li>Stir fried noodles</li>
        </ul>
    
    <h2>B. Ordered List</h2>
        <ol>
            <li>Python</li>
            <li>JavaScript</li>
            <li>Java</li>
            <li>C#</li>
            <li>C++</li>
        </ol>
    </body>
</html>
