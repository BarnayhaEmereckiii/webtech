<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION</title>
</head>
<body>
        <form action="/submit" method="post">
            <label for="FullName">Full Name:</label>
            <input type="text" id="FullName" name="FullName" minlength="2" maxlength="50" required ><br><br>

            <label for="StudentID">Student ID:</label>
            <input type="text" id="StudentID" name="StudentID" maxlength="9" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            
            <label for="Birthday">Birthday:</label>
            <input type="date" id="Birthday" name="Birthday" required><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="prefer_not_to_say" name="gender" value="prefer_not_to_say">
            <label for="prefer_not_to_say">Prefer not to say</label>

            <input type="radio" id="gender_other" name="gender" value="other">
            <label for="gender_other">Other / Self-describe:</label>
            <input type="text" name="gender_custom" placeholder="Please specify">
            
            <p>
                <label for="program">Program:</label>
                <select id="program" name="program" required>
                <option value="" disabled selected>Select your program</option>
                <option value="bsit">BS Information Technology</option>
                <option value="bscs">BS Computer Science</option>
                <option value="bsis">BS Information Systems</option>
                </select>
            </p>
            <label>Hobbies:</label>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="gaming" name="hobbies" value="gaming">
            <label for="gaming">Gaming</label>

            <br>
            <label for="hobbies_custom">Hobbies:</label>
            <input type="text" id="hobbies_custom" name="hobbies_custom" placeholder="Other Hobbies (e.g. Photography, Cooking)">
            
            <p>
                <label for="address">Address:</label><br>
                <textarea id="address" name="address" rows="3" cols="30" placeholder="123 Street Name, City"></textarea>
            </p>

            <p>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </p>
        </form>
</body>
</html>
